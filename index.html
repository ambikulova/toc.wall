<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOC Wall — default state</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600&display=swap" rel="stylesheet">
<style>
/*
  TOC WALL — default state only (no incident, nothing flying).
  Everything is sized in rem; root font-size tracks the viewport so the same
  layout reads on TOC1 (4x4 of 55" = one 4K surface) and TOC2 (one 86" 4K).
  1rem = 10px at 1920x1080, 20px at 3840x2160.
*/
:root{
  /* Campus Guardian Angel / TOC App design system tokens, remapped onto this file's own variables (no tokens.css, no component bundle) */
  --bg:#211a1b;      /* Background-Neutral-Surface (page) */
  --panel:#2a2223;   /* tiles: a slightly lighter tone of the #211a1b surface (custom, not a system token; replaces Elevation-1 #33292a) */
  --panel-2:#4d3f3f; /* Background-Neutral-Elevation-2 */
  --line:#ffffff33;  /* Border-Light-Low-Emphasis: decorative hairline, never meaningful on its own */
  --tile-line:#ffffff1a; /* tile outer border: 1px, half the --line opacity so tile edges sit quieter than the dividers inside them (raised panel colour already separates tiles) */
  --divider:#ffffff1a;   /* hairline dividers inside tiles (rows, cells, footers): 10%, same as the tile border, quieter than --line, which stays for header dividers, chip outlines and controls */
  --ink:#ffffff;     /* Text-On-dark-Highest-emphasis */
  --mute:#d3d2d2;    /* Text-Light-gray (secondary) */
  --dim:#b8b4b4;     /* Text-Gray (tertiary / meta) */
  --ok:#00b933;      /* Border-Semantic-Success */
  --warn:#ffbe04;    /* no general warning token in the system: nearest is Dashboard-Status-Background-Verification */
  --bad:#ef4141;     /* Basic-Background-Danger-Default / Border-Semantic-Error: escalating states only */
  --info:#59a8ff;    /* Text-Brand-Highest-emphasis: page background or Elevation-1 only, never Elevation-3/4 */
  --brand:#1b64f5;   /* Basic-Background-Brand-Default */
  --brand-hover:#297fff; /* Basic-Background-Brand-Hover */
  --sea:#211a1b; --land:#33292a; --land-edge:#594a4a; /* map: Surface / Elevation-1 / Elevation-3 */
  /* incident stages (Dashboard-Status-Background-*): filled stage badge + grid frame */
  --st-ver:#ffbe04; --st-res:#dc2626; --st-med:#297fff; --st-reu:#227c4d;
  --head:"Titillium Web","Helvetica Neue",Arial,sans-serif; /* one family, two weights: 400 body, 600 headings/buttons */
  --body:"Titillium Web","Helvetica Neue",Arial,sans-serif;
  /* Type scale. The system's px are 4K wall pixels: 1rem = 20px at 3840x2160 (10px at 1080p). 24px floor = 1.2rem. */
  --fs-cap:1.2rem; --lh-cap:1.4rem;  /* Caption / Caption-Semibold 24/28 - smallest step */
  --fs-b3:1.4rem;  --lh-b3:2rem;     /* b3 28/40 - dense panels */
  --fs-b2:1.6rem;  --lh-b2:2rem;     /* b2 32/40 */
  --fs-b1:1.8rem;  --lh-b1:2.4rem;   /* b1 36/48 - default body */
  --fs-btn:1.8rem; --lh-btn:2rem;    /* Button 36/40 */
  --fs-note:2rem;  --lh-note:3.2rem; /* Notification 40/64 - high-attention single values */
  --fs-title:1.6rem; /* tile titles 32px (raised from H6 28px on request) */
  --fs-h6:1.8rem;  --lh-h6:2rem;     /* H6: raised from the system's 28px to 36px on request, so in-tile headings read bigger than tile titles */
  /* H2-H5: APPROXIMATION interpolated between H6 and H1 - not sourced from the real system */
  --fs-h5:1.7rem; --fs-h4:2rem; --fs-h3:2.3rem; --fs-h2:2.6rem;
  --fs-h1:2.8rem;  --lh-h1:3.2rem;   /* H1 56/64 - largest step */
}
*{box-sizing:border-box;margin:0;padding:0}
b,strong,h1,h2,h3,h4,h5,h6{font-weight:600} /* never bold/black: the system loads 400 + 600 only */
html{font-size:min(calc(100vw/192),calc(100vh/108))}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-b1);line-height:var(--lh-b1);
  width:100vw;height:100vh;overflow:hidden;display:grid;grid-template-rows:7.2rem 1fr 2.8rem;gap:1rem;padding:1rem;
  font-variant-numeric:tabular-nums}

/* ---------- brand header (persistent identity chrome, both states; in Active it also carries the incident: trigger, campus (address), stage + duration) ---------- */
#brand{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2.4rem;min-width:0} /* min-width:0: never wider than the screen, so a long incident address truncates instead */ /* 1.2rem above + below the 4.8rem content row (header row = 7.2rem) */
#brand .logo{height:4.08rem;width:auto;display:block}
/* left group: logo | divider | identity tag (TOC of the team on shift), 1.6rem (16px at 1080p) between each */
#brand .lgrp{display:flex;align-items:center;gap:2rem} /* logo | 20px | divider | 20px | TOC tag */
#brand .dv{width:1px;height:3rem;background:var(--line)}
#toc-badge{font-family:var(--head);font-weight:600;font-size:var(--fs-b1);line-height:1;letter-spacing:.02em;color:var(--ink);position:relative;top:-.38rem} /* same cap height as the logo wordmark; lifted so both share one baseline (measured) */
#brand .bgrp{display:flex;align-items:center;gap:2rem}
#net-slot:empty{display:none} /* no outage chip -> no stray gap before the stage badge */
#brand .badge{font-family:var(--head);font-weight:600;font-size:var(--fs-b1);letter-spacing:.02em;border:1px solid var(--line);border-radius:2rem;padding:.2rem 1.8rem .3rem;background:var(--bg)}
#brand .badge span{color:var(--mute);font-weight:400}
/* stage badge, both states: top-right corner of the header (Active adds the running duration to its left) */
#stage-badge .chip{font-family:var(--head);font-weight:600;font-size:var(--fs-btn);line-height:1;padding:.5rem 1.6rem .6rem;gap:.9rem}
/* Active stage badge: solid Dashboard-Status fill, white text (dark text on Verification yellow for contrast); the word is always shown */
#stage-badge .chip.st-ver{background:var(--st-ver);border-color:var(--st-ver);color:var(--bg)}#stage-badge .chip.st-res{background:var(--st-res);border-color:var(--st-res);color:var(--ink)}#stage-badge .chip.st-med{background:var(--st-med);border-color:var(--st-med);color:var(--ink)}#stage-badge .chip.st-reu{background:var(--st-reu);border-color:var(--st-reu);color:var(--ink)}
#stage-badge{display:flex;align-items:center}
#stage-badge .chip #dur{font:inherit;color:inherit;font-variant-numeric:tabular-nums;padding-left:.9rem;border-left:1px solid color-mix(in srgb,currentColor 40%,transparent)} /* Active: running incident duration inside the stage badge, after a hairline divider */
/* Weather strip (header, between the TOC tag and the outage chip / stage badge): every campus town, news-ticker crawl right-to-left.
   Track holds the list twice and slides -50% so the loop is seamless; JS sets the duration from the width so speed is constant.
   Each town: name, icon, temperature; 1px divider between towns. Active: one static item. */
#wx-strip{flex:1;min-width:0;width:0;align-self:stretch; /* width:0 so the long track never widens the header (the body grid sizes rows to content) */display:flex;align-items:center;overflow:hidden;margin:0 3.2rem;mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
#wx-strip.static{flex:1 0 auto;width:auto;justify-content:flex-end;mask-image:none;margin-right:0} /* Active: keeps its own width and acts as the spacer, never squeezed */
.wx-track{flex:none;display:flex;align-items:center;width:max-content;animation:wxCrawl 120s linear infinite;will-change:transform}
#wx-strip.static .wx-track{animation:none}
@keyframes wxCrawl{to{transform:translateX(-50%)}}
.wx-i{display:flex;align-items:center;gap:1rem;padding:0 2.4rem;border-left:1px solid var(--line);white-space:nowrap;font-size:var(--fs-b1);line-height:1;color:var(--mute)}
#wx-strip.static .wx-i{border-left:0;padding:0} /* Active: no side padding, so a full header gives the address the room */
.wx-i b,.wx-i em{font-family:var(--head);font-weight:600;font-style:normal;font-size:var(--fs-b1);color:var(--ink)}
.wx-i svg{width:2.4rem;height:2.4rem;flex:none;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header incident group (Active only): | campus (address) | trigger | before the stage badge; same type scale as the weather ---------- */
#inc-hd[hidden]{display:none}
#inc-hd{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:2rem;padding:0 2rem; /* 20px either side of every divider */white-space:nowrap} /* the only header item that shrinks: the address truncates first */
#inc-hd .inc{min-width:0;display:flex;align-items:baseline;gap:.8rem}
#inc-hd .inc b{flex:none;font-family:var(--head);font-weight:600;font-size:var(--fs-b1);line-height:1;color:var(--ink)}
#inc-hd .ad{min-width:0;display:flex;font-family:var(--head);font-weight:400;font-size:var(--fs-b1);line-height:1;color:var(--mute)}
#inc-hd .ad::before{content:"("}#inc-hd .ad::after{content:")"}
#inc-hd .ad i{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis} /* long address ends "...)" - the closing bracket always shows */
#inc-hd .trg{flex:none;display:flex;align-items:center;gap:1rem}
#inc-hd .trg img{width:3.6rem;height:3.6rem;display:block} /* source icon (no source name); type/subtype text beside it where the source has one */
#inc-hd .trg b{font-family:var(--head);font-weight:600;font-size:var(--fs-b1);line-height:1;color:var(--ink)}

/* ---------- grid ---------- */
#grid{display:grid;gap:1rem;min-height:0;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr); /* default: 4 equal rows; map spans cols 1-2 x rows 1-3; every cell is used */
  grid-template-areas:
   "map map list peer"
   "map map tz feed"
   "map map comms rota"
   "news sites drone sched"}
/* ACTIVE has its own area map: drone feeds cols 1-2 x rows 1-2; Keyword matches cols 1-2 x rows 3-4; col 3 = Threat status, Channel stats, Local news, Caution notes; col 4 = Suspect information over Shared assets (rows 2-4). No Drone readiness in Active: per-drone detail lives on the feeds. */
#grid.act{grid-template-rows:repeat(4,1fr);grid-template-areas:
   "feeds feeds list sus"
   "feeds feeds stats assets"
   "kw kw news assets"
   "kw kw notes assets"}
/* ACTIVE, alternative layout (footer switch, Active only): no Keyword matches; Suspect information spans cols 3-4 on row 1; Caution notes takes the 2x2 below the feeds */
#grid.act.alt{grid-template-areas:
   "feeds feeds sus sus"
   "feeds feeds list assets"
   "notes notes stats assets"
   "notes notes news assets"}
#grid.act.alt #t-kw{display:none}
#grid.act.alt #t-suspect .sp{font-size:4rem;padding-bottom:.6rem} /* double-width tile: description 40px (26px in the standard layout); 2 lines for the mock sightings, a 3-line description still fits */
.tile{background:var(--panel);border:1px solid var(--tile-line);border-radius:.6rem;padding:1.4rem 1.6rem;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
/* ONE tile-title style, used by every tile (default + active): small semibold condensed, muted, sentence case; optional dim meta at the right only when it carries data */
.tile>h2,.half>h2,.pad>h2,#t-map .ttl{font-family:var(--head);font-weight:600;font-size:var(--fs-title);line-height:1;letter-spacing:.03em;color:var(--mute);margin-bottom:.7rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex:none}
.tile>h2 span,.half>h2 span,.pad>h2 span,#t-map .ttl span{font-family:var(--body);font-weight:400;font-size:var(--fs-cap);letter-spacing:0;color:var(--dim)}
.tile>h2 span.ok{color:var(--ok)}.tile>h2 span.bad,#t-map .ttl span.bad{color:var(--bad)}.tile>h2 span.warn{color:var(--warn)}
/* TOC peer status */
/* Peer status + Planned sites: rows share the space equally (flex:1) with a hairline between them, so content fills the tile and spacing around each divider is equal */
#peer{flex:1;display:flex;flex-direction:column;min-height:0}
.prow{flex:1;display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:2.2rem;line-height:1.25;border-top:1px solid var(--divider)} /* raised on request */
.prow .chip{font-size:1.7rem}
.prow:first-child{border-top:0}
/* Feed & system health: 2x2 scoreboard, value colour = status */
.health{flex:1;display:grid;grid-template-columns:1fr 1fr}
.hc{display:flex;flex-direction:column;justify-content:center;gap:.4rem;min-width:0}
.hc:nth-child(even){padding-left:1.6rem;border-left:1px solid var(--divider)}
.hc:nth-child(n+3){border-top:1px solid var(--divider)}
/* HERO FIGURES (Feed & system health, Team rotation, Time zones): deliberately above H1 so wall-critical values stand out - an exception to the type scale */
.hc b{font-family:var(--head);font-weight:600;font-size:3.6rem;line-height:1;white-space:nowrap;color:var(--ink)} /* data is white; colour is reserved for badge statuses */
.hc small{font-size:1.8rem;color:var(--mute)} /* data labels under the hero figures (Feed & system health, Drone readiness): raised from Caption on request */
.hc b .sec{font-family:var(--body);font-weight:400;font-size:var(--fs-b2);color:var(--mute)} /* beacon age ("· 15s") secondary to Fresh / Stale */
/* Independent comms (default): one row per TOC, rows share the height with a hairline between (same grammar as Planned sites / TOC peer status) */
#comms{flex:1;display:flex;flex-direction:column;min-height:0}
.ci{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.4rem;border-top:1px solid var(--divider);min-width:0}
.ci:first-child{border-top:0}
.ci .hd{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.ci .hd b{font-family:var(--head);font-weight:600;font-size:2.4rem;line-height:1.1} /* TOC name */
.ci .hd .chip{font-size:1.7rem}
.ci .ln{font-size:2rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci .ln.m{font-size:1.7rem;color:var(--mute)}.ci .ln.e{color:var(--dim)} /* raised on request */
#t-map{grid-area:map;padding:0}
#t-list{grid-area:list}#t-feed{grid-area:feed;padding:0}#t-peer{grid-area:peer}
#t-drone{grid-area:drone}#t-news{grid-area:news}#t-sites{grid-area:sites;padding:0}#t-comms{grid-area:comms}#t-stats{grid-area:stats}#t-assets{grid-area:assets}#t-kw{grid-area:kw}#t-suspect{grid-area:sus}#t-notes{grid-area:notes}
#t-rota{grid-area:rota}#t-sched{grid-area:sched;padding:0}
/* ACTIVE: four drone feeds in a 2x2 (same lanes as Drone readiness). Scoped to #t-feeds; the base .screen look is reused. */
/* one container: the 2px gap shows the container colour (--divider) as the divider between feeds */
#t-feeds{grid-area:feeds;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;min-height:0;min-width:0;border:1px solid var(--tile-line);border-radius:.6rem;overflow:hidden;background:var(--divider)} /* gap colour = the in-tile divider (10% white over the page), was the brighter --land-edge */
#t-feeds .fd{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#211a1b}
#t-feeds .fd .screen{border-radius:inherit;transition:opacity .3s}
#t-feeds .fd.dim .screen{opacity:.45}
#t-feeds .fd.frozen .screen::before{animation-play-state:paused}
/* Shared assets, same language as the drone feeds: one rounded container, 2px dividers, main slot full-width on top + 2x2 below;
   each slot carries a bottom-left label (asset name + source/age) on a black gradient that fades upward; photos / clips fill the slot (img or muted looping video). */
#t-assets .ag{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.5fr 1fr 1fr;gap:2px;border:1px solid var(--tile-line);border-radius:.6rem;overflow:hidden;background:var(--divider)} /* gap colour = the in-tile divider, was --land-edge */
#t-assets .ag .screen{border-radius:0;min-width:0}
#t-assets .ag .main{grid-column:1/-1}
#t-assets .med{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s}
#t-assets .screen.down .med{opacity:.15}
#t-assets .ah{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;padding:2.4rem 1.2rem 1rem;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.5) 55%,transparent);z-index:2;transition:opacity .3s}
#t-assets .ah b{font-family:var(--head);font-weight:600;font-size:2rem;line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#t-assets .ah span{font-size:1.4rem;line-height:1;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#t-assets .ah>*{max-width:100%} /* cap each label line at the slot width so long names / sources truncate with an ellipsis instead of running past the edge */
#t-assets .main .ah b{font-size:var(--fs-h4)}
#t-assets .main .ah span{font-size:var(--fs-cap)}
#t-assets .ag .screen:not(.main) .fb b{font-size:var(--fs-h5)}
#t-assets .ag .screen:not(.main) .fb span{display:none}
 /* Feed layout from the Pilot App feed tile: top-left box letter + pilot (swatch, name) + building/floor;
   top-right lane · floor; bottom-left state + link chips. Drone ID is deliberately NOT shown (the reference layout has none). */
#t-feeds .hd{position:absolute;left:1.2rem;top:1.2rem;max-width:calc(100% - 13rem);display:flex;align-items:center;gap:1.1rem;padding:.6rem 1.4rem .6rem .6rem;border-radius:.5rem;background:rgba(0,0,0,.62);z-index:2;transition:opacity .3s}
#t-feeds .bx{flex:none;width:4.6rem;height:4.6rem;display:flex;align-items:center;justify-content:center;border:2px solid var(--c,var(--land-edge));border-radius:.4rem;font-family:var(--head);font-weight:600;font-size:var(--fs-h3);line-height:1;color:var(--ink)}
#t-feeds .hd .pi{min-width:0;display:flex;flex-direction:column;gap:.4rem}
#t-feeds .hd .pn{display:flex;align-items:center;gap:.8rem;font-family:var(--head);font-weight:600;font-size:var(--fs-h4);line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#t-feeds .hd .pn i{flex:none;width:1.6rem;height:1rem;border-radius:.15rem;background:var(--c)}
#t-feeds .hd .lo{font-size:1.5rem;line-height:1;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#t-feeds .hd .free{font-size:var(--fs-b1);color:var(--dim);white-space:nowrap}
#t-feeds .lf{position:absolute;right:1.2rem;top:1.2rem;padding:.5rem 1rem;border-radius:.4rem;background:rgba(0,0,0,.62);font-family:var(--head);font-weight:600;font-size:var(--fs-h6);line-height:1;color:var(--ink);white-space:nowrap;z-index:2;transition:opacity .3s}
#t-feeds .bl{position:absolute;left:1.2rem;bottom:1.2rem;display:flex;align-items:center;gap:.6rem;z-index:2;transition:opacity .3s}
#t-feeds .bl .chip{background:rgba(0,0,0,.62)}
#t-feeds .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#211a1b;transition:opacity .3s}
#t-feeds .screen.down .vid{opacity:.15}
/* Time zones: CT (Austin HQ, where the team and office are) is the hero; PT/MT/ET are a quiet row with offsets from CT. Weight: CT 600, others 400. */
#t-tz{grid-area:tz;justify-content:space-between;gap:.6rem}
.tz-ct b em{font-style:normal;font-size:3.4rem;color:var(--mute);margin-right:1.2rem;vertical-align:.25em}
.tz-ct b{display:block;font-family:var(--head);font-weight:600;font-size:8.4rem;line-height:.95;letter-spacing:.01em;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.tz-ct b i{font-style:normal;font-size:4.6rem;color:var(--mute);margin-left:.2rem}
.tz-ct b u,.tz-o div u{text-decoration:none;color:var(--mute)} /* AM / PM: muted, part of the time but quieter than the digits */
.tz-ct b u{font-size:4.6rem;margin-left:1rem}
.tz-o div u{margin-left:.5rem}
.tz-o{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;border-top:1px solid var(--divider);padding-top:1rem}
.tz-o div{font-family:var(--head);font-weight:400;font-size:var(--fs-b1);line-height:var(--lh-b1);color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.tz-o div span{margin-right:.6rem;color:var(--mute)}
.tz-o div small{display:block;font-family:var(--body);font-weight:400;font-size:1.5rem;color:var(--mute)}
.half{background:var(--panel);padding:1.4rem 1.6rem;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.big{font-family:var(--head);font-weight:600;line-height:1}
.mute{color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:.7rem;padding:.25rem 1rem .3rem;border-radius:10rem;border:1px solid var(--line);font-size:var(--fs-b3);white-space:nowrap}
/* status chips: word + colour, no dot (the word always carries the status) */
.chip.ok{color:var(--ok);border-color:rgba(0,185,51,.35)}
.chip.bad{color:var(--bad);border-color:rgba(239,65,65,.45)}
.chip.warn{color:var(--warn);border-color:rgba(255,190,4,.4)}
.chip.info{color:var(--info);border-color:rgba(89,168,255,.4)}
.chip.off{color:var(--mute)}

/* ---------- map ---------- */
#map-wrap{position:relative;flex:1;min-height:0;background:var(--sea);border-radius:.6rem}
#map-wrap svg{width:100%;height:100%;display:block}
#t-map .ttl{position:absolute;left:1.6rem;top:1.4rem;z-index:2;margin:0} /* floats over the map: same top-left offset as every tile's padding, zero layout height */
.legend{position:absolute;left:2rem;bottom:1.6rem;pointer-events:none;z-index:2;display:flex;gap:2rem;font-size:1.5rem;color:var(--mute)} /* legend + refresh time: 15px, raised slightly on request */
#map-refresh{position:absolute;right:2rem;bottom:1.6rem;z-index:2;font-size:1.5rem;color:var(--mute);pointer-events:none;white-space:nowrap}
#map-refresh b{color:var(--ink);font-weight:600}
.legend i{display:inline-block;width:1.4rem;height:1.4rem;border-radius:50%;margin-right:.6rem;vertical-align:-.15rem}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:1.2}
.grat{fill:none;stroke:var(--panel);stroke-width:1}
/* state borders: same --land-edge token as the national outline but thinner/fainter, so they read as background reference */
.sb{fill:none;stroke:var(--land-edge);stroke-width:.55;opacity:.65;stroke-linejoin:round;pointer-events:none}
.sl{fill:var(--mute);font-family:var(--body);font-size:12.5px;text-anchor:middle;opacity:.7;pointer-events:none}
.dot-live{fill:var(--ok)}.halo{fill:var(--ok);opacity:.16}
/* disconnected campus: its own marker (never clustered), solid red dot + a ring that scales out and fades; the only moving alarm element on the wall */
.dis-dot{fill:var(--bad)}.dis-halo{fill:var(--bad);opacity:.18}
.dis-ring{fill:none;stroke:var(--bad);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:disPulse 1.6s ease-out infinite}
@keyframes disPulse{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}

.mk text{font-family:var(--body);fill:var(--ink)}
/* .mk .badge: numeral inside a marker shape; 600 (no weight above 600 anywhere) */
.mk .badge{font-family:var(--head);font-weight:600;fill:var(--bg)}

/* ---------- campus list ---------- */
/* shared auto-scroll box (see fillList / scrollList): bottom fade only while it scrolls; --seam = space between the two looping copies */
.autoscroll{flex:1;min-height:0;overflow:hidden;position:relative;mask-image:linear-gradient(#000 88%,transparent)}
.autoscroll.still{mask-image:none}
.autoscroll .copy{padding:calc(var(--seam,1rem) / 2) 0;border-bottom:1px solid var(--divider)}
#list-scroll{--seam:1rem}
#list-inner{will-change:transform}
/* All connected: time-zone groups (zone + campus count), one row per campus (name + town); no per-row badge (the title says "All N connected" once).
   While the list scrolls, #list-pin holds the current zone's label at the top; the next zone's label pushes it up as it arrives (see pinList). */
.cgh{display:flex;align-items:baseline;gap:.8rem;margin-top:1.4rem;padding:0 0 .6rem;font-family:var(--head);font-weight:600;font-size:var(--fs-h6);line-height:1.3;letter-spacing:.03em;color:var(--mute)}
.copy>.cgh:first-child,#list-inner>.cgh:first-child{margin-top:0}
.cgh span{font-family:var(--body);font-weight:400;font-size:1.6rem;letter-spacing:0;color:var(--dim)}
#list-pin{position:absolute;left:0;right:0;top:0;z-index:1;margin:0;background:var(--panel);will-change:transform}
#list-pin[hidden]{display:none}
#list-pin::after{content:'';position:absolute;left:0;right:0;top:100%;height:1.2rem;background:linear-gradient(var(--panel),transparent);pointer-events:none} /* rows dissolve under the pinned label instead of being sliced */
.crow{display:flex;align-items:baseline;justify-content:space-between;gap:1.2rem;padding:.6rem 0;border-top:1px solid var(--divider);font-size:2rem;line-height:1.25}
.crow .nm{flex:1;min-width:0;color:var(--ink)} /* long names wrap, never cut */
.crow small{flex:none;font-size:1.6rem;color:var(--mute);white-space:nowrap}
/* Disconnected: ONE campus fills the tile, rotating every 9 s (longest outage first).
   who (name + town, full width) | how long (outage length as the hero numeral, unit, CT time lost) · hairline · why (reason + detail) | pager.
   The current pager dash fills white over the 9 s, counting down to the next card (hidden when only one campus is down).
   No red "Disconnected" badge: the pulsing tile edge and the red title count already say it. */
#list-card{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8rem}
#list-card[hidden]{display:none}
#t-list h2 #list-n{font-size:1.8rem} /* Campus list count ("1/3 disconnected" / "All 52 connected"): 18px like the card labels, larger than other tiles' title meta on request */
.dc-id{display:flex;align-items:baseline;min-width:0;line-height:1.3} /* one line: long names truncate with an ellipsis, the town always shows in full; 1.3 keeps Titillium descenders inside the clipped name */
.dc-id .nm{font-family:var(--head);font-weight:600;font-size:2.6rem;color:var(--ink);margin-right:.8rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-id .tw{flex:none;font-size:1.8rem;color:var(--mute);white-space:nowrap}
.dc-main{flex:none;display:grid;grid-template-columns:15rem minmax(0,1fr);column-gap:1.6rem} /* hugs its content (no stretch); spare tile height collects above the pager */
.dc-clock{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:1.6rem 1.6rem 1.6rem 0;border-right:1px solid var(--divider)} /* 16px top/bottom: the hairline runs 16px past the text */
.dc-clock b{font-family:var(--head);font-weight:600;font-size:6.4rem;line-height:.95;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.dc-clock b.hm{font-size:4.6rem} /* 1 h or more ("1:05 h"): smaller so the longest ("12:59 h") still fits the column */
.dc-clock b u{text-decoration:none;font-family:var(--body);font-weight:400;font-size:2rem;letter-spacing:0;color:var(--mute);margin-left:.5rem}
.dc-clock small{margin-top:.6rem;font-size:1.6rem;line-height:1.25;color:var(--mute);white-space:nowrap}
.dc-why{display:flex;flex-direction:column;justify-content:center;gap:.2rem;min-width:0;padding:1.6rem 0}
.dc-why .cz{font-size:2.2rem;line-height:1.2;color:var(--ink)}
.dc-why .dt{font-size:1.7rem;line-height:1.25;color:var(--mute)}
.dc-pg{display:flex;gap:.6rem;margin-top:auto} /* pinned to the card bottom */
.dc-pg i{flex:1;height:.4rem;border-radius:.2rem;background:var(--line);position:relative;overflow:hidden}
/* Timed fill bar, shared by the Campus list pager (9 s) and Team rotation (3 h shift): track = --line, fill = white growing left to right.
   --pg-t = window length, --pg-d = minus the time already elapsed (set per render), so a re-render resumes the fill instead of restarting it. */
.dc-pg i.on::after,.rs-bar:not(.full)::after{content:'';position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0);animation:pgFill var(--pg-t,9s) linear var(--pg-d,0s) forwards}
@keyframes pgFill{to{transform:scaleX(1)}}
/* tile needs attention (default state only: Campuses map + Campus list while any campus is disconnected; TOC peer status while any of its rows is not OK).
   Reuses the Active update pulse (updPulse, Threat status / Suspect information), looping for as long as the problem lasts; reduced motion falls back to a steady red edge */
.tile.alert{animation:updPulse 2.4s ease-in-out infinite}


/* ---------- drone ---------- */
.fleet{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.fleet div{display:flex;flex-direction:column}
.fleet .big{font-size:var(--fs-h1)}.fleet small{font-size:var(--fs-cap);color:var(--mute);margin-top:.4rem}
.ready{margin-top:auto}

/* ---------- news ---------- */
.screen{flex:1;min-height:0;border-radius:.4rem;background:#211a1b;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.screen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px),linear-gradient(120deg,#4d3f3f,#211a1b 55%,#33292a);animation:drift 14s linear infinite;background-size:auto,200% 100%}
@keyframes drift{to{background-position:0 0,-200% 0}}
/* Local news has its own motion (slow breathing studio glow) so it never reads as one of the drone feeds above, which keep the scrolling drift. */
#t-news .screen::before{background:radial-gradient(ellipse 60% 80% at 30% 50%,rgba(211,210,210,.22),transparent 70%),linear-gradient(180deg,#33292a,#211a1b);background-size:160% 100%,auto;background-position:0 0,0 0;animation:newsGlow 7s ease-in-out infinite alternate}
@keyframes newsGlow{to{background-position:100% 0,0 0}}
.screen .mt{position:absolute;right:1rem;top:1rem;display:flex;gap:.6rem;align-items:center;background:rgba(0,0,0,.6);padding:.3rem .9rem;border-radius:10rem;font-size:var(--fs-cap);color:var(--ink)}
.screen .fb{position:relative;color:var(--mute);font-size:var(--fs-cap);text-align:center;padding:0 1rem;display:none}
.screen.down .fb{display:block}
/* Local news screen look, shared by default and Active: muted pill top-left, channel name in the tile title, no caption over the picture. */
/* Local news: a muted looping clip (default: news-default.mp4, active: news-active.mp4) over the old glow, which stays as the fallback if a file is missing */
#t-news .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s}
#news.down .vid{opacity:.15}
#t-news>h2 span{font-family:var(--head);font-weight:600;font-size:var(--fs-title);letter-spacing:.03em;color:var(--mute)} /* channel name (both states): same size, weight, tracking and colour as the tile title */
#t-news .mt{left:1.2rem;right:auto;top:1.2rem;border:1px solid var(--land-edge);font-size:var(--fs-cap);color:var(--mute)}
#news .fb,#t-feeds .fb,#t-assets .fb{display:none;flex-direction:column;align-items:center;gap:.5rem;padding:0 2rem}
#news .fb b,#t-feeds .fb b,#t-assets .fb b{font-family:var(--head);font-weight:600;font-size:var(--fs-h2);line-height:1;color:var(--ink)}
#news .fb span,#t-feeds .fb span,#t-assets .fb span{font-size:var(--fs-b2);color:var(--mute)}
#news.down .fb,#t-feeds .screen.down .fb,#t-assets .screen.down .fb{display:flex}
#t-feeds .screen.down :is(.hd,.lf,.bl),#t-assets .screen.down .ah{opacity:.15}.screen.down::before{opacity:.15}

/* ---------- planned sites ---------- */
/* Planned sites: all sites listed as a schedule (no rotation). Bell time is Central. */
.srow{display:grid;grid-template-columns:10.6rem minmax(0,1fr) auto;gap:1.2rem;align-items:center;flex:1;border-top:1px solid var(--divider)}
.srow:first-of-type{border-top:0}
.srow .bt{font-family:var(--head);font-weight:600;font-size:var(--fs-h3);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.srow .sn{min-width:0;display:flex;flex-direction:column;gap:.3rem}
.srow .sn b{display:block;font-family:var(--head);font-weight:600;font-size:var(--fs-h5);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sn small{display:block;font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--mute);white-space:nowrap}
.srow .chip{font-size:var(--fs-cap)}
/* Planned sites + Team schedule (same row treatment): larger time / name / location-or-detail / status, above the type scale.
   Sized so "Godby High School" and "Tallahassee, FL · in 3h 12m" still fit at 1080p; the time column sizes to the time. */
#site-a .srow,#sched-a .srow{grid-template-columns:auto minmax(0,1fr) auto}
#site-a .srow .bt,#sched-a .srow .bt{font-size:2.4rem;margin-right:1.2rem} /* extra space after the time: 24px to the name / event (row gap 12px + 12px) */
#site-a .srow .sn b,#sched-a .srow .sn b{font-size:2.1rem} /* 2.1: largest where "Incident walkthrough" still fits beside a 12:55 PM time and an "in 42 min" chip */
#site-a .srow .sn small,#sched-a .srow .sn small{font-size:1.6rem;line-height:1.2}
#site-a .srow .chip,#sched-a .srow .chip{font-size:1.5rem}
/* Planned sites + Team schedule, raised on request: name 22px, detail 17px, chip 17px, tighter name/detail gap */
#site-a .srow .sn,#sched-a .srow .sn{gap:.1rem}#site-a .srow .sn b,#sched-a .srow .sn b{font-size:2.2rem}#site-a .srow .sn small,#sched-a .srow .sn small{font-size:1.7rem}#site-a .srow .chip,#sched-a .srow .chip{font-size:1.7rem} /* 22px: the largest where "Windy City onboarding" still fits beside a 7:30 AM time and an "in 2h 50m" chip; both tiles match */
.fade{animation:fadeIn .8s ease}
@keyframes fadeIn{from{opacity:0}}

/* ---------- comms ---------- */


/* ---------- rotation ---------- */
.who{padding:.4rem 0;border-top:1px solid var(--divider);display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.who:first-of-type{border-top:0}
.who b{font-weight:600;font-size:var(--fs-h5)}.who small{color:var(--mute);font-size:var(--fs-cap);margin-left:.8rem}
.who time{color:var(--mute);font-size:var(--fs-cap);white-space:nowrap}
.sub{font-family:var(--head);font-weight:600;font-size:var(--fs-h6);color:var(--ok);margin:0 0 .1rem;display:flex;justify-content:space-between;align-items:baseline}
.sub time{font-family:var(--body);font-weight:400;font-size:var(--fs-cap);color:var(--mute)}
.sub.nx{color:var(--info);margin-top:.4rem}
/* Team rotation: who is on shift is the hero; next shift is one muted line; bar = elapsed share of the 3 h shift */
/* Team rotation: two groups pinned top and bottom (who's on now / progress toward the next handover), even gaps inside each */
#rota-st{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;padding-top:.3rem}
.rs-on{display:flex;flex-direction:column;gap:.9rem}
.rs-on small{display:block;font-size:1.6rem;line-height:1;color:var(--mute)}
.rs-on b{display:block;font-family:var(--head);font-weight:600;font-size:6.4rem;line-height:1;color:var(--ink)}
.rs-on b span{font-family:var(--body);font-weight:400;font-size:2.4rem;color:var(--ink);margin-left:1rem}
.rs-bar{height:.4rem;border-radius:.2rem;background:var(--line);margin-bottom:1.1rem;position:relative;overflow:hidden} /* same timed bar as the Campus list pager; fills over the 3 h shift */
.rs-bar.full{background:var(--warn)} /* shift time is up (waiting for the next team to sign in): full and yellow, continuing the "Ending soon" fill */
#rota-meta .chip{margin:-.4rem 0;font-style:normal;font-size:1.4rem} /* 14px (raised slightly from the 12px small chip); negative margin keeps the title height */
.rs-bar.end::after{background:var(--warn)} /* last 15 min: the fill turns yellow, matching the "Ending soon" badge */ /* "Ending soon" / "Waiting for Team N" badge: no extra title height */
.rs-nx{font-size:1.7rem;line-height:1;color:var(--mute)}.rs-nx b{font-weight:600;color:var(--ink)}

/* ---------- demo-only state toggle (below the grid, not part of either state) ---------- */
#demo-toggle{display:flex;align-items:center;gap:1.4rem;font-size:var(--fs-cap);color:var(--mute);padding:0 .6rem;min-height:0}
#demo-toggle .seg{display:inline-flex;border:1px solid var(--line);border-radius:.4rem;background:var(--panel);overflow:hidden}
#demo-toggle button{font:inherit;font-size:var(--fs-cap);color:var(--mute);background:transparent;border:0;padding:.2rem 1.8rem;cursor:pointer}
#demo-toggle button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
#demo-toggle button:focus-visible{outline:2px solid var(--info);outline-offset:-2px}


/* ---------- map extras (default-state map) ---------- */
#map-wrap{overflow:hidden}
#map .land,#map .grat{vector-effect:non-scaling-stroke}

/* ---------- ACTIVE: threat status board ---------- */
#t-list #tb{flex:1;display:flex;flex-direction:column;min-height:0}
.tr{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.2rem;align-items:center;border-top:1px solid var(--divider)}
.tr:first-child{border-top:0}
.tr .w{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.tr .w b{font-family:var(--head);font-weight:600;font-size:3rem;line-height:1.1;white-space:nowrap} /* Threat status sizes restored to the pre-type-scale values on request: name 30px, detail 17px, chip 15px, empty 20px */
.tr .w small{font-size:1.7rem;line-height:1.2;color:var(--mute)}
.tr .chip{font-size:1.5rem}
.tr.none{justify-content:center;font-size:2rem;color:var(--dim);display:flex;align-items:center}
.chip.sm{font-size:var(--fs-cap);padding:.05rem .8rem .1rem;justify-content:center}

/* ---------- drone lanes (both states) ---------- */
.dsite{display:flex;flex-direction:column;gap:.4rem;padding-bottom:.4rem;min-width:0}
/* Drone readiness campus name: hero size (34px at 1080p), above the type scale like the figures below it; 1.15 line + .3rem clip padding (cancelled by the negative margin) keeps descenders whole without growing the tile */
.dsite b{font-family:var(--head);font-weight:600;font-size:3.4rem;line-height:1.15;padding-bottom:.3rem;margin-bottom:-.3rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsite span{font-size:2rem;line-height:1.2;color:var(--mute)} /* campus location: raised on request */
.health.dct{grid-template-rows:1fr;border-top:1px solid var(--divider);min-height:0}
.nest{margin-top:auto;display:flex;align-items:center;gap:1.2rem;font-size:1.6rem;color:var(--mute);padding-top:.4rem;white-space:nowrap} /* no divider above the nest row (removed on request) */
.nest .chip{font-size:1.6rem;padding:.05rem .8rem .1rem} /* nest footer text + chip raised on request (both states) */
.nest b{color:var(--ink);font-weight:600}
/* Drone lanes in the ACTIVE state use the default state's lane grammar; a muted second line carries pilot / location / link / video */
/* Drone readiness, ONE lane row for both states: lane · drone · who (pilot in flight / "Docked" in the nest) · pack voltage · state badge.
   Equal-height hairline rows; campus sits in the tile-title meta; nest footer below. */
.lanes{flex:1;min-height:0;display:grid;grid-template-columns:2.8rem minmax(0,1fr) 5.8rem 5.4rem auto;grid-auto-rows:minmax(0,1fr);column-gap:.8rem} /* one column grid shared by all rows (subgrid) so lane/voltage/badge line up */
.lr{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:subgrid;align-items:center;border-top:1px solid var(--divider);font-size:var(--fs-b3);line-height:1;white-space:nowrap}
.lr:first-child{border-top:0}
.lr>*{min-width:0}
.lr .bx{width:2.8rem;height:2.8rem;display:flex;align-items:center;justify-content:center;border:2px solid var(--c,var(--land-edge));border-radius:.35rem;font-family:var(--head);font-weight:600;font-size:var(--fs-b3);line-height:1;color:var(--ink)}
.lr .who i{display:inline-block;width:1.4rem;height:.9rem;margin-right:.7rem;border-radius:.15rem;background:var(--c);vertical-align:middle}
.lr .lf{font-family:var(--head);font-weight:600;font-size:var(--fs-b3);color:var(--mute);font-variant-numeric:tabular-nums}
.lr .who{font-family:var(--head);font-weight:600;font-size:var(--fs-b2);color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.lr .who:not(.dock){text-align:right} /* Active: pilot names sit against the lane column; default "Docked" stays left */
.lr .who.dock{font-family:var(--body);font-weight:400;font-size:var(--fs-b3);color:var(--mute)}
.lr .pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.lr .pc.crit{color:var(--bad)}
.lr .chip{justify-self:end}
.lr .free{grid-column:2/-1;color:var(--dim)}
.lr.dim>*{opacity:.45}


/* ---------- ACTIVE: key events / comms activity ---------- */
.pad{padding:1.4rem 1.6rem;height:100%;display:flex;flex-direction:column;min-height:0}
#t-suspect .sp{font-size:2.6rem;line-height:1.3;padding-bottom:.4rem;color:var(--ink);overflow:hidden}
#t-suspect .sp.none{font-size:2rem;color:var(--dim);flex:1;display:flex;align-items:center;justify-content:center}
/* update cue (Suspect information, Threat status): the outline glows red twice, and a red "Updated" badge takes the title's top-right corner for 5 s */
.tile.upd{animation:updPulse 2.4s ease-in-out}
@keyframes updPulse{0%,50%,100%{border-color:var(--tile-line);box-shadow:none}25%,75%{border-color:var(--bad);box-shadow:0 0 2.4rem rgba(239,65,65,.35)}} /* 1px red edge + soft glow (no extra spread ring, so the edge stays 1px) */
.upd-chip{font-style:normal;font-size:var(--fs-cap);padding:.1rem .7rem .15rem;margin:-.3rem 0} /* negative margin: the badge never makes the title row taller */ /* <i> element: upright; smaller than the 1.5rem chip.sm */
.tile>h2 .meta{animation:fadeIn .3s ease} /* corner content (badge <-> time / count) fades in when it swaps */
/* Channel stats: one band per channel (name + people on top), then five equal stat cells. Each cell is a small panel: big centred figure over its label; zero cells recede. */
/* Channel stats: a matrix (answers down, channels across) so every label and channel name appears once and a row compares channels.
   Column heads in the Campus-list group-header style; equal-height hairline rows; figures semibold white, zeros dim; no fills/bars/colour. */
#stats-body{flex:1;min-height:0;display:grid;grid-template-columns:9rem repeat(3,minmax(0,1fr));grid-template-rows:auto repeat(3,minmax(0,1fr));column-gap:.8rem} /* 9rem label column ("Heard shot" is 83px) + .8rem gap: room for "Coordination" at 18px */
#stats-body>*{display:flex;align-items:center;min-width:0;border-top:1px solid var(--divider)}
#stats-body .sh{flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:.4rem;padding-bottom:.9rem;border-top:0;font-family:var(--head);font-weight:600;font-size:var(--fs-h6);line-height:1;letter-spacing:.03em;color:var(--mute);white-space:nowrap}
#stats-body .sh span{font-family:var(--body);font-weight:400;font-size:1.5rem;letter-spacing:0;color:var(--dim)}
#stats-body .sl{font-size:1.8rem;color:var(--mute);white-space:nowrap}
#stats-body .sv{font-family:var(--head);font-weight:600;font-size:2.6rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
#stats-body .sv.z{color:var(--dim)} /* Channel stats sizes raised on request (pre-type-scale values): people 15px, row label 18px, figure 26px; channel name stays 18px, the most "Coordination" fits */
/* Keyword matches: one row per message, equal heights with hairlines (same grammar as Planned sites / peer rows) */
#kw-body{flex:1;min-height:0;display:flex;flex-direction:column}
.kr{flex:1;min-height:0;display:grid;grid-template-columns:9.4rem minmax(0,1fr) 9.4rem 10.4rem 13rem;gap:1.4rem;align-items:center;border-top:1px solid var(--divider);font-size:var(--fs-b2);line-height:var(--lh-b2);white-space:nowrap}
.kr:first-child{border-top:0}
.kr time{color:var(--mute);font-size:var(--fs-b2)} /* same size as the message text */
.kr .m{overflow:hidden;text-overflow:ellipsis}
.kr .chn{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.kr .sn{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.kr .loc{color:var(--mute);overflow:hidden;text-overflow:ellipsis} /* channel / name / location columns sized to their longest values (86 / 94 / 125px at 1080p) + a little room; location left-aligned so it sits one gap after the name; the freed width goes to the message */
.kr mark{background:var(--warn);color:var(--bg);border-radius:.3rem;padding:0 .4rem}
.kn{flex:1;display:flex;align-items:center;color:var(--dim);font-size:var(--fs-b1)}
/* Caution notes (Active, read-only reference for the incident campus): icon + description per row, hairline between rows (same grammar as the other lists);
   text wraps; when the notes are taller than the tile they loop slowly upward (shared .autoscroll, same as the Campus list), otherwise they stay still */
#notes-body{--seam:1.8rem;display:flex;flex-direction:column}
#notes-inner{will-change:transform}
.cn{flex:none;display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:1.2rem;align-items:start;padding:.9rem .4rem .9rem 0;border-top:1px solid var(--divider);font-size:var(--fs-b2);line-height:var(--lh-b2);color:var(--ink)}
.cn:first-child{border-top:0;padding-top:.1rem}
.cn img{width:3.6rem;height:3.6rem;display:block}
.cn p{padding-top:.5rem;overflow-wrap:anywhere}
/* alternative layout: notes fill a 2x2 tile, so they read larger (text 24px, icons 48px); still loops if a campus has more than fit */
#grid.alt .cn{grid-template-columns:4.8rem minmax(0,1fr);gap:1.6rem;padding:1.4rem .4rem 1.4rem 0;font-size:2.4rem;line-height:1.3}
#grid.alt .cn:first-child{padding-top:.1rem}
#grid.alt .cn img{width:4.8rem;height:4.8rem}
#grid.alt .cn p{padding-top:.6rem}

/* ---------- demo-only: alarm switch, alarm modal, stage border ---------- */
#demo-toggle .sw{display:inline-flex;align-items:center;gap:.9rem;padding:0;font-size:var(--fs-cap)}
#demo-toggle .sw .trk{width:4.4rem;height:2.4rem;border-radius:1.2rem;border:2px solid var(--dim);background:transparent;position:relative;transition:background .15s,border-color .15s}
#demo-toggle .sw .trk::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
#demo-toggle .sw[aria-checked=true] .trk{background:var(--brand);border-color:var(--brand)}
#demo-toggle .sw[aria-checked=true] .trk::after{background:var(--ink);transform:translateX(2rem)}
#demo-toggle .sw[aria-checked=true]{color:var(--ink)}
#demo-toggle .sw:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:.4rem}
/* trigger source for the next alarm run (read when the switch turns on) */
#demo-toggle .src{display:inline-flex;align-items:center;gap:.8rem;font-size:var(--fs-cap)}
#demo-toggle select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:.4rem;padding:.1rem .6rem;cursor:pointer}
#demo-toggle select:focus-visible{outline:2px solid var(--info);outline-offset:-2px}
#alarm-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(239,65,65,.2),rgba(239,65,65,.2)),rgba(0,0,0,.6)}
/* pulse: a second layer of the SAME red fades in and out over the backdrop (colours unchanged, motion added) */
#alarm-ov::before{content:"";position:absolute;inset:0;background:rgba(239,65,65,.3);opacity:0;animation:almPulse 1.6s ease-in-out infinite;pointer-events:none}
@keyframes almPulse{50%{opacity:1}}
.alm{position:relative;width:80rem;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;overflow:hidden;box-shadow:0 2rem 6rem rgba(0,0,0,.6)}
.alm-h{background:var(--bad);color:var(--ink);padding:1.8rem 2.4rem;display:flex;flex-direction:column;gap:1rem;align-items:center;text-align:center}
.alm-t{font-family:var(--head);font-weight:600;font-size:var(--fs-h1);line-height:1;letter-spacing:.02em}
.alm-w{display:flex;align-items:center;justify-content:center;gap:1.2rem;font-size:var(--fs-b1);line-height:1}
.alm-b{display:inline-flex;align-items:center;gap:.8rem;background:rgba(0,0,0,.28);border-radius:2rem;padding:.4rem 1.4rem .5rem;font-family:var(--head);font-weight:600;font-size:var(--fs-btn)}
.alm svg{width:2.4rem;height:2.4rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alm-b img{width:2.8rem;height:2.8rem;flex:none;display:block} /* trigger-source icon file (TRIGGER_ICON) */
.alm-ty{font-size:var(--fs-b1);line-height:1} /* Centegix only: alert type · subtype */
.alm-c{padding:2.4rem}
.alm-bld{display:flex;align-items:center;gap:1.8rem;padding-bottom:2rem;margin-bottom:2rem;border-bottom:1px solid var(--line)}
.alm-bld svg{width:5rem;height:5rem;color:var(--mute)}
.alm-bld b{display:block;font-family:var(--head);font-size:var(--fs-h2);line-height:1;font-weight:600}
.alm-bld b i{font-style:normal;color:var(--mute);margin:0 1.2rem}
.alm-bld span{display:block;margin-top:.6rem;color:var(--mute);font-size:var(--fs-b1)}
.alm-bx{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.alm-bx>div{border:1px solid var(--line);border-radius:.6rem;padding:1.4rem 1.8rem;background:var(--panel);font-size:var(--fs-b1);display:flex;flex-direction:column;gap:.7rem}
.alm-bx small{display:block;font-family:var(--head);font-weight:600;font-size:var(--fs-h6);line-height:1;letter-spacing:.03em;color:var(--mute)}
.alm-bx b{font-family:var(--head);font-weight:600;font-size:var(--fs-h2);line-height:1}
.alm-bx .ck{display:flex;align-items:center;gap:1rem}.alm-bx .ck svg{width:3rem;height:3rem;color:var(--mute)}
.alm-bx .sub{color:var(--mute)}
/* shared outage dimming (same .45 as the Active drone-lane dim); toggled by applyOutage() on Independent Comms, Drone readiness, Planned sites / Key events, Campus list / Threat status, Keyword matches / Channel stats (Active), map dot markers and the header incident group / stage badge */
.outage-dim{opacity:.45}
/* bottom stops above the demo footer: --footer-h is measured in JS (setFooterH); 1.5rem = body bottom padding (1rem) + half the grid gap */
#stage-frame{position:fixed;left:0;right:0;bottom:calc(var(--footer-h,2.8rem) + 1.5rem);top:8.2rem; /* header bottom: wraps the grid */border:2px solid transparent;pointer-events:none;z-index:40}
#stage-frame.f-ver{border-color:var(--st-ver)}#stage-frame.f-res{border-color:var(--st-res)}#stage-frame.f-med{border-color:var(--st-med)}#stage-frame.f-reu{border-color:var(--st-reu)}

/* Titillium Web's glyph box is taller than Barlow's: single-line labels that clip (overflow hidden) get room for descenders */
#inc-hd .ad,#t-feeds .hd .pn,#t-feeds .hd .lo,#t-assets .ah b,#t-assets .ah span,.srow .sn b{line-height:1.3}
@media (prefers-reduced-motion:reduce){.dis-ring{animation:none}.screen::before,#t-news .screen::before{animation:none}.fade{animation:none}#alarm-ov::before{animation:none}.wx-track{animation:none}.tile.upd,.tile>h2 .meta{animation:none}.tile.alert{animation:none;border-color:var(--bad)}.dc-pg i.on::after{animation:none;transform:none}}
</style>

  const schedule = [
    ev('Drone flight training', 'Training', 'Austin HQ', -20, 60),
    ev('Incident walkthrough', 'Presentation', 'Room 2A', 40, 45),
    ev('Weekly team sync', 'Meeting', 'TOC floor', 120, 30),
    ev('Windy City onboarding', 'Training', 'Video call', 210, 60),
    ev('Shift handover review', 'Review', 'TOC floor', 300, 30)

    health:{ cams:[camsUp,cams], drones:[111,116], beacon:["Fresh · 12s", "ok"], flight:["Nominal","ok"] },

  const WX_FIXED = { 'Tallahassee, FL': { t: 79, k: 'sun' }, 'Tampa, FL': { t: 84, k: 'part' }, 'Chicago, IL': { t: 54, k: 'rain' } };

  D.campuses.filter(c => c.stale).forEach(c => { c.cause = CAUSES[Math.floor(rnd() * CAUSES.length)]; });
}

const rad = d => d*Math.PI/180;
const P = (()=>{ const p1=rad(29.5),p2=rad(45.5),p0=rad(37.5),l0=rad(-96);
  const n=(Math.sin(p1)+Math.sin(p2))/2, C=Math.cos(p1)**2+2*n*Math.sin(p1), r0=Math.sqrt(C-2*n*Math.sin(p0))/n;
  const raw=(lon,lat)=>{const r=Math.sqrt(C-2*n*Math.sin(rad(lat)))/n,t=n*(rad(lon)-l0);return[r*Math.sin(t),-(r0-r*Math.cos(t))]};
  const pts=OUTLINE.map(o=>raw(o[0],o[1])), xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const s=Math.min(940/(maxx-minx),560/(maxy-miny)), ox=(1000-(maxx-minx)*s)/2-minx*s, oy=(620-(maxy-miny)*s)/2-miny*s+14;
  return (lon,lat)=>{const q=raw(lon,lat);return[q[0]*s+ox,q[1]*s+oy]};
})();

const SVGNS="http://www.w3.org/2000/svg";
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e};

function cluster(list){ // greedy clustering in projected space
  const R=26, groups=[];
  list.forEach(c=>{
    c.xy=P(c.lon,c.lat);
    const g=groups.find(g=>Math.hypot(g.x-c.xy[0],g.y-c.xy[1])<R);
    if(g){g.items.push(c);g.x=g.items.reduce((a,i)=>a+i.xy[0],0)/g.items.length;g.y=g.items.reduce((a,i)=>a+i.xy[1],0)/g.items.length}
    else groups.push({x:c.xy[0],y:c.xy[1],items:[c]});
  });
  return groups;
}

// State borders: an edge shared by two states' rings is an interior border and is stroked once; an edge used by only one ring is coast/national
// border, already drawn (crudely) by OUTLINE's .land stroke, so it is skipped to avoid a doubled coastline. (Shared edges have identical
// coordinates because the data was simplified before splitting into states.)
let STATE_PATH = null;
function stateBorderPath(){
  if(STATE_PATH) return STATE_PATH;
  const cnt=new Map(), segs=[];
  Object.values(STATES).forEach(st=>st[3].forEach(r=>{ const n=r.length/2;
    for(let i=0;i<n;i++){ const a=i*2, b=((i+1)%n)*2, k1=r[a]+','+r[a+1], k2=r[b]+','+r[b+1], key=k1<k2?k1+'|'+k2:k2+'|'+k1;
      cnt.set(key,(cnt.get(key)||0)+1); segs.push([key,r[a],r[a+1],r[b],r[b+1]]); } }));
  const seen=new Set(); let d='';
  segs.forEach(([key,x1,y1,x2,y2])=>{ if(cnt.get(key)<2||seen.has(key)) return; seen.add(key);
    const p=P(x1,y1), q=P(x2,y2); d+=`M${p[0].toFixed(1)},${p[1].toFixed(1)}L${q[0].toFixed(1)},${q[1].toFixed(1)}`; });
  return STATE_PATH=d;
}
// Labels only for states that have a connected campus THIS session (set derived from D.campuses[].st, re-derived on every render).
// Labels are always the two-letter abbreviation.
function drawStates(svg){
  el('path',{d:stateBorderPath(),class:'sb'},svg);
  const have=new Set(D.campuses.map(c=>c.st));
  have.forEach(ab=>{ const st=STATES[ab]; if(!st) return;
    const [x,y]=P(st[1],st[2]);
    const t=el('text',{x,y:y+4,class:'sl'},svg); t.textContent = ab; });
}

function renderMap(){
  const svg=document.getElementById('map'); if(!svg) return; svg.innerHTML='';
  // faint graticule
  for(let lon=-120;lon<=-70;lon+=10){const d=[];for(let lat=24;lat<=50;lat+=2){const p=P(lon,lat);d.push(p.join(','))}el('polyline',{points:d.join(' '),class:'grat'},svg)}
  for(let lat=25;lat<=50;lat+=5){const d=[];for(let lon=-126;lon<=-66;lon+=2){const p=P(lon,lat);d.push(p.join(','))}el('polyline',{points:d.join(' '),class:'grat'},svg)}
  el('polygon',{points:OUTLINE.map(o=>P(o[0],o[1]).join(',')).join(' '),class:'land',"stroke-linejoin":"round"},svg);
  drawStates(svg); // state borders + labels sit above the land fill, below dots/clusters/legend
  // connected campuses cluster as before; disconnected ones are NEVER clustered, so each one is visible at its own location
  cluster(D.campuses.filter(c=>!c.stale)).forEach(g=>{
    const n=g.items.length, m=el('g',{class:'mk',transform:`translate(${g.x},${g.y})`},svg);
    if(n===1){el('circle',{r:15,class:'halo'},m);el('circle',{r:7.5,class:'dot-live'},m)}
    else {
      const r=13+Math.min(n,8)*1.2;
      el('circle',{r:r+8,class:'halo'},m); el('circle',{r,class:'dot-live'},m);
      const b=el('text',{y:6.5,'text-anchor':'middle','font-size':n>9?18:20,class:'badge'},m);b.textContent=n;
    }
  });
  // disconnected: drawn last (on top) — red halo, pulsing ring, solid red dot
  D.campuses.filter(c=>c.stale).forEach(c=>{
    const [x,y]=P(c.lon,c.lat), m=el('g',{class:'mk dis',transform:`translate(${x},${y})`},svg);
    el('circle',{r:15,class:'dis-halo'},m); el('circle',{r:7.5,class:'dis-ring'},m); el('circle',{r:7.5,class:'dis-dot'},m);
  });
}

// Refresh time: plain HH:MM:SS (24 h) + relative phrase. NOT ticking: re-rendered once per minute (60 s interval below).
let refreshShown = null; // last live-rendered {t, ago}; frozen copy is shown during an outage
function renderRefresh(){
  const el=document.getElementById('map-refresh'); if(!el) return;
  if(!D.refreshedAt) D.refreshedAt=Date.now()-D.refreshed*1000;
  if(!OUTAGE||!refreshShown){
    const t=new Date(D.refreshedAt).toLocaleTimeString('en-GB',{hour12:false}), sec=Math.max(1,Math.round((Date.now()-D.refreshedAt)/1000));
    refreshShown={t, ago:sec<60?sec+(sec===1?' second':' seconds'):Math.floor(sec/60)+(sec<120?' minute':' minutes')};
  }
  el.innerHTML=`${OUTAGE?'Last known · updated ':''}<b>${refreshShown.t}</b> (${refreshShown.ago} ago)`;
}

let listShownAt = Date.now(); // start of the current 9 s Campus list rotation window (drives the pager fill)
let listCur = null; // name of the disconnected campus on the Campus list card (kept across re-renders while it stays down)
const disList = () => D.campuses.filter(c => c.stale).sort((a, b) => a.last - b.last); // longest outage first
function renderList(){
  const inner=document.getElementById('list-inner'), box=document.getElementById('list-scroll'), card=document.getElementById('list-card'), meta=document.getElementById('list-n'); if(!inner) return;
  const n=D.campuses.length, dis=disList();
  const mode=dis.length?'dis':'all'; if(inner.dataset.mode!==mode){ inner.dataset.mode=mode; inner._y=0; } // new view starts at the top
  document.getElementById('t-list').classList.toggle('alert',dis.length>0);
  if(dis.length){
    // one campus fills the tile; the list scroller is parked (no rows = scrollList skips it)
    box.hidden=true; inner._rows=undefined; inner.innerHTML='';
    let i=dis.findIndex(c=>c.name===listCur); if(i<0) i=0; const c=dis[i]; listCur=c.name;
    const lost=new Date(c.last).toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'}); // 12-hour CT, like the Time zones tile
    const mins=Math.max(1,Math.round((Date.now()-c.last)/60000)); // outage length: hero numeral, unit underneath
    const clock=mins<60?`<b>${mins}<u>min</u></b>`:`<b class="hm">${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}<u>h</u></b>`; // unit sits on the numeral's baseline
    const [why,detail]=c.cause||CAUSES[0];
    card.hidden=false;
    const el=Math.min(9000,Math.max(0,Date.now()-listShownAt)); // time already spent in the current 9 s rotation window
    card.innerHTML=`<div class="dc-id"><b class="nm">${c.name}</b><span class="tw">${c.town}</span></div>`+
      `<div class="dc-main"><div class="dc-clock">${clock}<small>since ${lost} CT</small></div>`+
      `<div class="dc-why"><span class="cz">${why}</span><span class="dt">${detail}</span></div></div>`+
      (dis.length>1?`<div class="dc-pg">${dis.map((_,k)=>`<i${k===i?` class="on" style="--pg-d:-${el}ms"`:''}></i>`).join('')}</div>`:''); // no pager when only one campus is down (nothing rotates)
    meta.className='bad'; meta.textContent=`${i+1}/${dis.length} disconnected`;
    return;
  }
  listCur=null; card.hidden=true; card.innerHTML=''; box.hidden=false;
  // all connected: grouped by time zone east to west (same zones as the Time zones tile), campuses A-Z inside each; name + town per row
  const ZONE={'America/New_York':'Eastern','America/Detroit':'Eastern','America/Chicago':'Central','America/Denver':'Mountain','America/Boise':'Mountain','America/Phoenix':'Mountain','America/Los_Angeles':'Pacific'};
  const g={}; D.campuses.forEach(c=>{ const z=ZONE[c.tz]||'Other'; (g[z]=g[z]||[]).push(c); });
  const rows=['Eastern','Central','Mountain','Pacific','Other'].filter(z=>g[z]).map(z=>`<div class="cgh" data-z="${z}">${z}<span>${g[z].length}</span></div>`+g[z].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<div class="crow"><span class="nm">${c.name}</span><small>${c.town}</small></div>`).join('')).join('');
  fillList(inner,box,rows);
  meta.className='ok'; meta.textContent=`All ${n} connected`;
}
// Shared auto-scroll for lists that can outgrow their tile (Campus list in default, Caution notes in Active).
// The rows are shown once and stay still if they fit; only when they're taller are they shown as two identical copies
// (each wrapped in .copy so first/last-row trims match) and the slow seamless upward scroll runs. Never moves when it fits.
const SCROLLERS = [['list-inner', 'list-scroll'], ['notes-inner', 'notes-body']]; // [inner, box] ids
function fillList(inner,box,rows){
  inner._rows=rows; inner.innerHTML=rows; const scroll=inner.scrollHeight>box.clientHeight;
  if(scroll) inner.innerHTML=`<div class="copy">${rows}</div><div class="copy">${rows}</div>`;
  inner.dataset.scroll=scroll?'1':''; box.classList.toggle('still',!scroll);
  if(!scroll||inner._y===undefined){ inner._y=0; inner.style.transform='none'; }
}
// Campus list (all connected): keep the current time zone's label pinned at the top while the rows scroll under it;
// the next zone's in-flow label pushes the pin up, and once it reaches the top the pin takes its text (seamless: same .cgh look).
function pinList(){
  const pin=document.getElementById('list-pin'), inner=document.getElementById('list-inner'), box=document.getElementById('list-scroll'); if(!pin||!inner) return;
  const on=!box.hidden&&inner.dataset.scroll==='1'; if(pin.hidden===on) pin.hidden=!on; if(!on) return;
  const y=inner._y||0, hs=inner.querySelectorAll('.cgh'); if(!hs.length) return;
  let k=0; for(let j=0;j<hs.length;j++){ if(hs[j].offsetTop<=y+.5) k=j; else break; }
  const cur=hs[k], next=hs[k+1];
  if(pin._z!==cur.dataset.z+cur.textContent){ pin._z=cur.dataset.z+cur.textContent; pin.innerHTML=cur.innerHTML; }
  const ph=pin.offsetHeight, d=next?next.offsetTop-y:Infinity;
  pin.style.transform=d<ph?`translateY(${d-ph}px)`:'none';
}
function scrollList(){
  SCROLLERS.forEach(([i,b])=>{
    const inner=document.getElementById(i), box=document.getElementById(b); if(!inner||!box||inner._rows===undefined) return;
    const dup=inner.dataset.scroll==='1', h=dup?inner.scrollHeight/2:inner.scrollHeight;
    if((h>box.clientHeight)!==dup){ fillList(inner,box,inner._rows); return; } // fit changed (fonts loaded, resize): re-decide
    if(dup){ inner._y=(inner._y+.35)%h; inner.style.transform=`translateY(${-inner._y}px)`; }
  });

  requestAnimationFrame(scrollList);
}

function tzOffMin(tz){ const d=new Date(), P=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(d).map(x=>[x.type,+x.value]));
  return (Date.UTC(P.year,P.month-1,P.day,P.hour,P.minute)-Math.floor(d/60000)*60000)/60000; }
function bellCT(s){
  const m=/^(\d+):(\d+) (AM|PM)$/.exec(s.bell); if(!m) return s.bell;
  let mins=((+m[1]%12)+(m[3]==='PM'?12:0))*60+ +m[2]; mins=(mins+tzOffMin('America/Chicago')-tzOffMin(s.tz)+1440)%1440;
  const h=Math.floor(mins/60); return `${h%12||12}:${String(mins%60).padStart(2,'0')} ${h<12?'AM':'PM'}`;
}

const TZ = {PT:'America/Los_Angeles',MT:'America/Denver',CT:'America/Chicago',ET:'America/New_York'};
const OFF={PT:'−2h',MT:'−1h',ET:'+1h'};

  const ct=t('CT'), other=c=>{ const x=t(c); return `<div><span>${c}</span>${x.hm}${x.s}<u>${x.ap}</u><small>${OFF[c]}</small></div>`; };

// Two teams, 3 h on / 3 h off, 24 h a day, anchored at 6:00 AM: Team 1 6-9, Team 2 9-12, T1 12-3, T2 3-6, T1 6-9 pm, T2 9-12 am, T1 12-3 am, T2 3-6 am.
const hr12 = h => ((h % 24) % 12 || 12) + (h % 24 < 12 ? ' AM' : ' PM');
// Shifts run on Central Time (Austin HQ), like Team schedule and Planned sites: minutes since CT midnight.
const ctMin = (d = new Date()) => { const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', hourCycle: 'h23', hour: 'numeric', minute: 'numeric' }).formatToParts(d).map(x => [x.type, +x.value])); return p.hour * 60 + p.minute; };
function shiftNow(d = new Date()) {
  const slot = Math.floor(((ctMin(d) - 360 + 1440) % 1440) / 180); // 0..7, CT
  const h0 = (6 + slot * 3) % 24;
  const team = s => (s % 2 === 0 ? '1' : '2');
  return { slot, on: team(slot), next: team(slot + 1), onTime: hr12(h0) + '–' + hr12(h0 + 3), nextTime: hr12(h0 + 3) + '–' + hr12(h0 + 6) };
}
let rotaSlot = -1; // key of the Team rotation markup on screen (slot + state); rebuilt only when it changes
// Shift handover model. MOCK: the incoming team "signs in" LOGIN_DELAY after each scheduled boundary; until then the outgoing team stays on.
const SHIFT_MS = 180 * 60000, ENDING_MS = 15 * 60000, LOGIN_DELAY = 4 * 60000;
let ALT_LAYOUT = false; // DEMO ONLY: Active alternative layout (footer switch)
let ROTA_OFF = 0, SHIFT_SEL = 'live'; // DEMO ONLY: footer Shift control shifts Team rotation's clock (and the header TOC tag); 0 = live
const rotaNow = () => Date.now() + ROTA_OFF;
const slotElapsed = d => (((ctMin(d) - 360 + 1440) % 1440) % 180) * 60000 + d.getSeconds() * 1000 + d.getMilliseconds(); // ms into the scheduled 3 h slot
function rotaState(t = rotaNow()) {
  const d = new Date(t), s = shiftNow(d), el = slotElapsed(d), other = n => (n === '1' ? '2' : '1');
  if (el < LOGIN_DELAY) return { state: 'waiting', key: s.slot + 'w', on: other(s.on), next: s.on, overMs: el, nextTime: s.onTime }; // shift over, next team not signed in yet
  const left = SHIFT_MS - el, ending = left <= ENDING_MS;
  return { state: ending ? 'ending' : 'on', key: s.slot + (ending ? 'e' : 'o'), on: s.on, next: s.next, until: s.onTime.split('–')[1], leftMs: left, elapsedMs: el, nextTime: s.nextTime };
}
// Header identity tag: the TOC of the team on shift now (TOC1 = Team 1, TOC2 = Team 2), from the same rotaState() as Team rotation,

  const item = town => { const w = D.wx[town]; return w ? `<span class="wx-i">${act ? '' : `<b>${town}</b>`}${IC[w.k]}<em>${w.t}°</em></span>` : ''; }; // Active: icon + temp only (the address next to the badge names the town)
  const html = towns.map(item).join(''), k = (act ? 'a' : 'd') + html;

  if (!act) { speed(); document.fonts.ready.then(() => { if (!el.classList.contains('static')) speed(); }); }
}
function renderRota(){
  const el = document.getElementById('rota-st'); if(!el) return;
  const r = rotaState(), meta = document.getElementById('rota-meta');
  const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const live = r.state === 'ending' ? 'ends in ' + mmss(r.leftMs)
    : r.state === 'waiting' ? (r.overMs < 60000 ? 'under 1 min over' : Math.floor(r.overMs / 60000) + ' min over')
    : 'until ' + r.until;
  if (r.key !== rotaSlot || !el.firstChild) { // state or shift changed: rebuild (the bar's fill is anchored to the elapsed time, so this never jumps it)
    rotaSlot = r.key;

    const nx = r.state === 'waiting' ? `<b>Team ${r.next}</b> not signed in yet · ${r.nextTime}` : `Next · <b>Team ${r.next}</b> · ${r.nextTime}`;
    el.innerHTML = `<div class="rs-on"><small>${r.state === 'waiting' ? 'Still on shift' : 'On shift now'}</small><b>Team ${r.on}<span id="rota-live">${live}</span></b></div><div class="rs-ft">${bar}<div class="rs-nx">${nx}</div></div>`;
    if (meta) meta.innerHTML = r.state === 'ending' ? '<i class="chip sm warn">Ending soon</i>' : r.state === 'waiting' ? `<i class="chip sm warn">Waiting for Team ${r.next}</i>` : '';
  } else { const lv = document.getElementById('rota-live'); if (lv && lv.textContent !== live) lv.textContent = live; } // countdown / overdue ticks in place
}

// In-place update (no re-render) so the screen animation never restarts.
function updateFeeds() {

    const v = f.querySelector('video.vid'); if (v) { const stop = frozen || OUTAGE; if (stop && !v.paused) v.pause(); else if (!stop && v.paused) v.play().catch(() => {}); } // frozen lane or Internet outage: picture stops
    f.querySelector('.hd .lo').textContent = stale ? '--' : bfLong(x.bf);
    f.querySelector('.lf').textContent = laneFloor(x, stale);
    const set = (sel, txt, cls) => { const b = f.querySelector(sel); b.textContent = txt; b.className = 'chip sm ' + sel.slice(1) + ' ' + cls; };
    set('.lkb', stale ? 'Link --' : 'Link ' + x.link, stale ? 'off' : x.link === 'Good' ? 'ok' : x.link === 'Weak' ? 'warn' : 'bad');

}
function renderDrone() {

  // shared row, same naming as the drone feeds: box letter (bordered in the pilot's colour) · swatch + pilot (or "Docked") · lane · floor · voltage · state
  const row = (bx, c, who, dock, lf, volt, crit, st, dim) => `<div class="lr${dim ? ' dim' : ''}"${c ? ` style="--c:${c}"` : ''}><b class="bx">${bx}</b><span class="who${dock ? ' dock' : ''}">${c ? '<i></i>' : ''}${who}</span><span class="lf">${lf}</span><span class="pc${crit ? ' crit' : ''}">${volt}</span><span class="chip sm ${LANE_CHIP[st]}">${st}</span></div>`;
  const free = bx => `<div class="lr"><b class="bx">${bx}</b><span class="free">Free · no drone</span></div>`;

  if (!act) { // default: rotating campus, name first, then nests + drones connected (Feed & system health cell style)

      cell(site.nests, site.nests === 1 ? 'Drone nest' : 'Drone nests') + cell(`${site.drones[0]} / ${site.drones[1]}`, 'Drones connected') + `</div>` + nestLine(site.nest);
    return;
  } else {
    const L = D.incident.lanes, used = L.filter(x => x.state !== 'FREE').length;

    rows = L.map(x => {

const TRIGGER_ICON = { 'Mobile App': 'trigger-mobile-app.svg', ZeroEyes: 'trigger-zeroeyes.svg', 'Centegix Beacon': 'trigger-centegix-beacon.svg', 'Centegix Mobile': 'trigger-centegix-mobile.svg', Raptor: 'trigger-raptor.svg' };

let centegixRun = 0;
function setTriggerSource(I, src) { // copies that source's mock (I.srcMock) onto the incident: via, role, camera, type/subtype
  const m = I.srcMock[src] || {}, a = m.alerts ? m.alerts[centegixRun++ % m.alerts.length] : null;
  I.via = src; I.by = m.by || null; I.cam = m.cam || null;

const typeText = I => I.type ? I.type + (I.subtype ? ' · ' + I.subtype : '') : ''; // "type · subtype", or type alone

// Keyword watchlist: threat / safety terms only. Longest first so "gunshot" wins over "gun".
const KEYWORDS = ['gun', 'gunshot', 'gunfire', 'shots', 'rifle', 'weapon', 'blood', 'suspect', 'killer', 'shooter', 'shooting', 'bullets'].sort((a, b) => b.length - a.length);
const KW_RE = new RegExp('\\b(' + KEYWORDS.join('|') + ')\\b', 'gi');
function renderKwActive() {
  const hits = D.incident.msgs.filter(m => { KW_RE.lastIndex = 0; return KW_RE.test(m.text); }).sort((a, b) => b.ts - a.ts).slice(0, 10);
  // keep the keyword on screen: if it starts past what fits in the column, show a snippet from a few words before it ("…saw a [rifle] near…"); CSS still cuts the end
  const snip = t => { KW_RE.lastIndex = 0; const k = KW_RE.exec(t); if (!k || k.index <= 20) return t; const from = t.lastIndexOf(' ', k.index - 12); return '…' + t.slice(from + 1); };
  document.getElementById('t-kw').innerHTML = `<h2>Keyword matches</h2><div id="kw-body">` +
    (hits.length ? hits.map(m => `<div class="kr"><time>${clk(m.ts)}</time><span class="m">${snip(m.text).replace(KW_RE, '<mark>$1</mark>')}</span><span class="chn">${m.ch}</span><span class="sn">${m.who}</span><span class="loc">${m.loc}</span></div>`).join('') : `<div class="kn">No keyword matches yet</div>`) + `</div>`;

  renderListActive(); renderDrone(); updateFeeds(); tickAssets(); tickSuspect();
}


// ---------- demo-only "Alarm triggered" sequence: force Default -> 2 s -> modal 5 s -> Active/Verification ----------
let alarmT1 = 0, alarmT2 = 0, alarmTick = 0;
const IC = {
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
  phone: '<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  bld: '<svg viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14M2 21h20M9 21v-5h6v5M9 10h.01M15 10h.01M12 10h.01"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  part: '<svg viewBox="0 0 24 24"><path d="M8 3v1.5M2.5 8.5H4M4.1 4.6l1.1 1.1M12 5.2l-1 1"/><path d="M6.5 11.5a3.5 3.5 0 0 1 6.2-1.6"/><path d="M8 20h9a4 4 0 0 0 .6-7.9A5.5 5.5 0 0 0 7.3 13.4 3.3 3.3 0 0 0 8 20z"/></svg>',
  rain: '<svg viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 .6-7.9A5.5 5.5 0 0 0 7 8.4 3.3 3.3 0 0 0 7 15z"/><path d="M8 18.5l-1 2M12 18.5l-1 2M16 18.5l-1 2"/></svg>'
};
function setAlarmSw(on) { const b = document.getElementById('alarm-sw'); if (b) b.setAttribute('aria-checked', on); }
function cancelAlarm() {
  clearTimeout(alarmT1); clearTimeout(alarmT2); clearInterval(alarmTick); alarmT1 = alarmT2 = alarmTick = 0;
  const o = document.getElementById('alarm-ov'); if (o) o.remove();
  setAlarmSw(false);
}
function startAlarm() {
  cancelAlarm(); setAlarmSw(true);
  setTriggerSource(D.incident, SRC_SEL); // the last source picked (dropdown is hidden in default) drives the modal and the header trigger
  if (MODE !== 'default') { MODE = 'default'; renderAll(false); }
  alarmT1 = setTimeout(showAlarmModal, 1000);
}
// Modal header by source: Mobile App keeps its phone glyph; other sources show their icon file. ZeroEyes = AI detection, so no "by" role.
function almHead(I) {
  const ic = I.via === 'Mobile App' ? IC.phone : TRIGGER_ICON[I.via] ? `<img src="${TRIGGER_ICON[I.via]}" alt="">` : '';
  const who = I.via === 'ZeroEyes'
    ? `<div class="alm-w"><span class="alm-b">${ic}ZeroEyes</span>detected threat on<span class="alm-b">Camera #${I.cam}</span></div>`
    : `<div class="alm-w">by<span class="alm-b">${IC.user}${I.by}</span>via<span class="alm-b">${ic}${I.via}</span></div>`;
  const type = I.via.startsWith('Centegix') && I.type ? `<div class="alm-ty">${typeText(I)}</div>` : ''; // Centegix Beacon / Mobile only: same type/subtype as the header trigger
  return `<b class="alm-t">Alarm triggered</b>${who}${type}`;
}
// Source dropdown (Active only): swaps the current incident's source and re-renders the header trigger straight away; no alarm sequence.
// Alternative layout switch (Active only): flips the grid's area map in place (no re-render, so the feeds and videos keep playing) and re-fits Caution notes.
document.getElementById('alt-slot').addEventListener('click', e => {
  const b = e.target.closest('#alt-sw'); if (!b || MODE !== 'active') return;
  ALT_LAYOUT = !ALT_LAYOUT; b.setAttribute('aria-checked', ALT_LAYOUT);
  document.getElementById('grid').classList.toggle('alt', ALT_LAYOUT); renderNotesActive();
});
// Shift dropdown (default only): moves Team rotation's clock to just before / after the next real shift boundary; from there it runs on normally.
document.getElementById('shift-slot').addEventListener('change', e => {
  if (e.target.id !== 'shift-sel') return;
  SHIFT_SEL = e.target.value; const now = Date.now(), boundary = now - slotElapsed(new Date(now)) + SHIFT_MS; // next scheduled change (real clock)
  const at = { ending: boundary - 12.5 * 60000, waiting: boundary + 30000, signed: boundary + LOGIN_DELAY + 5000 }[SHIFT_SEL];
  ROTA_OFF = at ? at - now : 0; rotaSlot = -1; renderRota(); renderBrand();
});
document.getElementById('src-slot').addEventListener('change', e => {
  const I = D.incident; if (!I || e.target.id !== 'src-sel' || MODE !== 'active') return;
  SRC_SEL = e.target.value; setTriggerSource(I, SRC_SEL);
  incHd.innerHTML = incHeader(I);
});
function showAlarmModal() {
  const I = D.incident; I.trigTs = Date.now();
  const o = document.createElement('div'); o.id = 'alarm-ov'; o.setAttribute('role', 'alertdialog'); o.setAttribute('aria-label', 'Alarm triggered');
  const hms = new Date(I.trigTs).toLocaleTimeString('en-GB', { hour12: false });
  o.innerHTML = `<div class="alm">
    <div class="alm-h">${almHead(I)}</div>
    <div class="alm-c"><div class="alm-bld">${IC.bld}<div><b>${I.campus}<i>·</i>${I.floor}</b><span>${I.addr}</span></div></div>
      <div class="alm-bx"><div><small>Location</small><b>${I.room}</b></div>
      <div><small>Triggered</small><div class="ck">${IC.clock}<b>${hms}</b></div></div></div></div></div>`;
  document.body.appendChild(o);
  alarmT2 = setTimeout(() => { cancelAlarm(); gotoStage('Verification'); }, 5000);
}
document.getElementById('alarm-sw').addEventListener('click', () => {
  document.getElementById('alarm-sw').getAttribute('aria-checked') === 'true' ? cancelAlarm() : startAlarm();
});

renderAll(); renderBrand(); scrollList();
setInterval(() => { renderClock(); renderBrand(); if (MODE === 'active') tickActive(); else { renderTz(); renderRota(); renderSchedule(); } }, 1000);
setInterval(() => { if (MODE === 'default') demoDrift(); }, 15000);
setInterval(() => { if (suspectLive()) updateSuspect(); }, 25000); // DEMO ONLY: mock suspect description updates in Active
setTimeout(() => setInterval(() => { if (threatsLive()) updateThreats(); }, 25000), 12500); // DEMO ONLY: mock threat updates, offset 12.5 s from the suspect ones
setInterval(() => { if (MODE === 'default') renderCaption(); }, 60000); // refresh time + disconnected durations

// rotate which campus's drone nest is shown (default state only) — same ~9 s cadence as the Planned Sites slot
setInterval(() => { const b = document.getElementById('drone'); if (MODE === 'default' && b && D.droneSites.length > 1) { droneIdx = (droneIdx + 1) % D.droneSites.length; renderDrone(); b.classList.remove('fade'); void b.offsetWidth; b.classList.add('fade'); } }, 9000);
setInterval(rotateList, 9000);

// No hotkeys: the footer controls are the only interactive elements in the prototype.
document.querySelectorAll('#demo-toggle button[data-m]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
document.getElementById('stage-slot').addEventListener('click', e => { const b = e.target.closest('button[data-stage]'); if (b && D.incident) gotoStage(b.dataset.stage); });
</script>
</body>
